# Disposable verification only. No host data directories or application credentials.
services:
  mongo:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports: ["127.0.0.1::27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { quit(rs.status().ok === 1 ? 0 : 1) } catch { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}); quit(1) }"]
      interval: 2s
      timeout: 5s
      retries: 30
  api:
    build: .
    image: kanban-api:local
    depends_on:
      mongo:
        condition: service_healthy
    ports: ["127.0.0.1::8000"]
    environment:
      MONGO_URL: mongodb://mongo:27017/?replicaSet=rs0
      MONGO_DB: kanban_test_container
      JWT_SECRET: disposable-container-test-jwt-secret-not-for-production
      PROXY_SECRET: disposable-container-test-proxy-secret-not-for-production
      APP_ENV: production
      COOKIE_SECURE: "true"
      TRUSTED_ORIGINS: '["https://kanban.sneakybeak.net"]'
